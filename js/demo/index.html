<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPronounce</title>
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --ink: #1d1b16; --muted: #6b665c; --line: #e4dfd4;
    --accent: #2f6f5e; --accent-ink: #ffffff; --bad: #b4412b; --bad-bg: #fbe9e4; --ok: #2f6f5e; --warn-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151512; --card: #1f1e1a; --ink: #eeeae0; --muted: #a39e92; --line: #34322c;
      --accent: #6cc3a8; --accent-ink: #10221c; --bad: #f08a72; --bad-bg: #3a221c; --ok: #6cc3a8; --warn-bg: #3a3320;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type=text] { width: 100%; font: inherit; font-size: 1.15rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font: inherit; font-size: .9rem; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button.primary { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); }
  button.primary[disabled] { opacity: .45; cursor: default; }
  button.primary.recording { background: var(--bad); }
  .file { font-size: .95rem; color: var(--muted); }
  .status { color: var(--muted); font-size: .92rem; min-height: 1.4em; margin-top: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .score { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .big { font-size: 3.2rem; font-weight: 700; line-height: 1; }
  .dims { display: flex; gap: 20px; color: var(--muted); }
  .dims b { color: var(--ink); font-weight: 600; }
  .words { font-size: 1.35rem; line-height: 2.2; margin: 18px 0 6px; }
  .w { padding: 2px 4px; border-radius: 6px; }
  .w.bad { background: var(--bad-bg); color: var(--bad); text-decoration: underline wavy; text-underline-offset: 5px; }
  .details { font-size: .95rem; }
  .details div { padding: 6px 0; border-top: 1px solid var(--line); }
  .ipa { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif; }
  .warn { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: .95rem; }
  .fine { color: var(--muted); font-size: .85rem; margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>OpenPronounce</h1>
  <p class="lede">Read a sentence aloud and see which words came out right. Everything runs in this page: the recording never leaves your computer.</p>

  <section class="card">
    <label for="sentence">Sentence to read</label>
    <input id="sentence" type="text" value="The quick brown fox jumps over the lazy dog" autocomplete="off" spellcheck="false">
    <div class="chips" id="examples"></div>
  </section>

  <section class="card">
    <div class="row">
      <button class="primary" id="record" disabled>Record</button>
      <span class="file">or <input id="file" type="file" accept="audio/*" disabled></span>
    </div>
    <div class="status" id="status">Loading the model…</div>
    <div class="bar" id="bar"><div></div></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="score">
      <div class="big" id="total"></div>
      <div class="dims">
        <span>Accuracy <b id="accuracy"></b></span>
        <span>Fluency <b id="fluency"></b></span>
        <span>Prosody <b id="prosodic"></b></span>
      </div>
    </div>
    <div class="warn" id="reasons" hidden></div>
    <div class="words" id="words"></div>
    <div class="details" id="details"></div>
    <div class="fine" id="timing"></div>
  </section>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
